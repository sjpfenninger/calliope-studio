name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags.
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
      - name: Lint
        run: pixi run lint
      - name: Check formatting
        run: pixi run -- black --check src/ tests/
      - name: Test
        # The sample .nc files are not in the repository, so tests that need a
        # solved model skip here. Keep it that way: CI covers logic, and the
        # numerical comparisons against v0.2.0 are run locally.
        run: pixi run test

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
      - name: Build wheel and check the interface is bundled
        # `python -m build` alone succeeds without the frontend and produces a
        # wheel with no interface, so the check is the point of this job.
        run: pixi run -e build build
