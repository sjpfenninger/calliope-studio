[build-system]
# 77 is the floor for PEP 639: the `license` expression and a project-level
# `license-files` are both errors on anything older.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "calliope-studio"
authors = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
maintainers = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
description = "Web UI for defining, running and analysing Calliope models."
readme = "README.md"
# The floor tracks Calliope, which declares `requires-python = ">=3.12"`. There
# is no reason for this project to support an interpreter the framework it wraps
# has dropped.
#
# The ceiling is capped rather than open-ended, and 3.14 is not an oversight —
# it is currently unreachable. `pandas` publishes no cp314 wheel before 2.3.3,
# and `pandas<2.3` below is forced by calliope 0.7.0.dev7 pinning
# `xarray<2024.4`, which pandas 2.3 and later refuse to work with. So 3.14 would
# resolve and then build pandas from source. The cap turns that into a
# resolution error, which says what is wrong; `uv tool install` otherwise picks
# the newest interpreter on the machine and the user meets a compiler instead.
# Lifting it is a consequence of a newer Calliope, not a decision to take here.
#
# 3.12 and 3.13 are also exactly what Calliope's own CI matrix covers, and the
# `interpreters` job in `ci.yml` covers the same two against the built wheel.
#
# This is *not* the floor the run worker requires, and the two must not be
# conflated when the environment registry lands: this bound is about the
# interpreter running the studio and its own dependency chain, while the
# worker's floor is a property of the worker's own source and applies to a
# foreign interpreter the studio never installs into.
requires-python = ">=3.12,<3.14"
keywords = ["energy systems", "visualisation", "optimisation"]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
  "calliope>=0.7.0.dev7,<0.8.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pyarrow>=17",
  "ruamel.yaml>=0.18",
  "click>=8.2",
  "platformdirs>=4",
  # Imported directly, not merely inherited. They do arrive transitively through
  # calliope and fastapi, so it worked — but an undeclared dependency is a
  # manifest that is fiction, and it left the pandas bound below with nowhere to
  # live that a user's install would ever read.
  #
  # calliope 0.7.0.dev7 pins xarray <2024.4, which pandas 2.3 and later refuse to
  # work with. Without this bound `pip install calliope-studio` resolves the
  # current pandas — 3.x — against xarray 2024.3, and the results layer fails on
  # first use. The constraint lived only in `[tool.pixi.dependencies]`, which is
  # the one place a user's install never reads.
  "pandas>=2.1.3,<2.3",
  "xarray>=2024.1,<2024.4",
  "numpy>=1.26",
  "pydantic>=2.7",
  # Reading a `.nc` structurally, without constructing a `calliope.Model`, is
  # what makes an older file openable — see `results/store.py`. It arrives with
  # xarray in practice but this layer names it directly.
  "netCDF4>=1.6",
]

[project.scripts]
calliope-studio = "calliope_studio.cli:main"

[project.urls]
homepage = "https://github.com/sjpfenninger/calliope-studio"
calliope = "https://www.callio.pe/"
repository = "https://github.com/sjpfenninger/calliope-studio"
documentation = "https://github.com/sjpfenninger/calliope-studio#readme"
issues = "https://github.com/sjpfenninger/calliope-studio/issues"
changelog = "https://github.com/sjpfenninger/calliope-studio/blob/main/CHANGELOG.md"

[tool.setuptools_scm]
# What the version is with no tags at all, which is this repository until
# the first release is tagged. Without it setuptools-scm falls back to
# 0.1.dev1.
fallback_version = "0.1.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["calliope_studio*"]

[tool.setuptools.package-data]
# The Vue bundle is built from `web/` into here by `pixi run web-build`, so that
# `calliope-studio` can serve the frontend from the same process as the API.
calliope_studio = ["server/static/**"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# Who can *develop* and what CI can run, not who can install: the wheel is
# `py3-none-any` and the conda package is `noarch`, so both already reach every
# platform. `coin-or-cbc` is on conda-forge for all four, so the development
# environment really does solve on each.
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
# Binary dependencies come from conda-forge; calliope (pre-release, PyPI-only)
# and pure-Python deps are resolved by uv via the editable self-install below.
python = ">=3.12,<3.14"
fastapi = ">=0.115"
uvicorn = ">=0.34"
pyarrow = ">=17"
"ruamel.yaml" = ">=0.18"
click = ">=8.2"
netcdf4 = "*"
# Mirrors the bound in `[project.dependencies]`, which is the source of truth —
# conda-forge resolves separately, so the constraint has to be stated twice.
pandas = "<2.3"
# Frontend toolchain, so `pixi run web-*` works without a separate Node install.
nodejs = ">=22"
# Solver for local runs: CBC is Calliope's default (`config.solve.solver`) and
# is not pip-installable, so it has to come from conda-forge. Gurobi is the
# `gurobi` feature below; CPLEX is used if the user has it on PATH.
coin-or-cbc = "*"

[tool.pixi.pypi-dependencies]
calliope-studio = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
gurobi = { features = ["dev", "gurobi"] }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"
# Only the `test-cov` task uses it; `test` stays uninstrumented. See the note
# on that task below for why the two are separate.
pytest-cov = "*"
# Pins the frontend toolchain into pixi.lock alongside everything else. The
# conda package depends on nodejs, so this one line fixes both the package
# manager and the Node version — which were previously pinned only inside CI,
# leaving every local build to use whatever was on PATH.
pnpm = "11.*"

[tool.pixi.feature.build.dependencies]
python-build = "*"
# The `build` task depends on `web-build` → `web-install`, which is pnpm — so
# without this the task cannot run in this environment at all, and never could.
# It is not only a red CI job: `release.yml` runs this same
# `pixi run -e build build`, so the first tag would have failed here.
# Pinned to match the `dev` feature; two pnpm versions across environments would
# be two lockfile resolutions of the same `web/pnpm-lock.yaml`.
pnpm = "11.*"
# For `publish-check`. The README is the PyPI long description, and it contains
# GitHub-flavoured `> [!IMPORTANT]` callouts that PyPI renders as plain block
# quotes — harmless, but worth seeing before the page is public rather than
# after, since a release cannot be re-uploaded under the same version.
twine = "*"

# Gurobi is not on conda-forge; it ships from its own anaconda.org channel,
# which hosts nothing else, so this cannot shadow a conda-forge package. Kept
# out of the default environment because it is ~45 MB and only useful with a
# licence: work with it as `pixi run -e gurobi serve`. The environment is
# deliberately not in the `default` solve-group — sharing one would add this
# channel to every other environment's lock entry for no gain.
#
# The package ships gurobipy but no `gurobi.sh`, which is fine: Pyomo 6.10
# resolves `solver: gurobi` to GUROBIFILE, which drives gurobipy directly, so
# both that and `config.build.backend: gurobi` work with nothing else on PATH.
[tool.pixi.feature.gurobi]
channels = ["gurobi"]

[tool.pixi.feature.gurobi.dependencies]
gurobi = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/calliope_studio"]
# Paths in the report are written relative to the repository root rather than
# absolute into the pixi environment, which is what lets Codecov attribute a
# line to a file in the tree. Without it every path is `/home/runner/work/...`
# and the report matches nothing.
relative_files = true

[tool.coverage.report]
# Neither is reachable at runtime, and both otherwise read as a genuine miss.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pixi.tasks]
lint = { cmd = "ruff check src/ tests/", description = "Lint the Python sources with ruff" }
format = { cmd = "ruff format src/ tests/", description = "Format the Python sources with ruff" }
format-check = { cmd = "ruff format --check src/ tests/", description = "Check Python formatting without writing; what CI runs" }
test = { cmd = "pytest", description = "Run the Python test suite" }
# Separate from `test` rather than `--cov` in `addopts`, which would apply to
# every invocation. The Windows CI job runs `test` with eleven `--ignore=`
# paths, so instrumenting it there would produce a partial report that Codecov
# would then merge into the complete one from Linux — a coverage number that
# drops whenever a deliberately-excluded file changes. Only the Linux job
# measures, and it measures the whole suite.
test-cov = { cmd = "pytest --cov --cov-report=xml --cov-report=term-missing", description = "Run the Python test suite with coverage; writes coverage.xml" }

# Frontend. `web-build` compiles the Vue bundle into the Python package so that
# a wheel serves the UI from the same process as the API.
#
# `--frozen-lockfile` is what makes the lockfile authoritative. This task used
# to run `npm install`, which *rewrites* the lockfile as a side effect, so every
# local build and two of three CI jobs resolved floated versions instead of the
# committed ones — which is how the tree drifted to axios 1.13 while
# package.json still said ^1.8. Use `web-update` to move versions deliberately.
web-install = { cmd = "pnpm install --frozen-lockfile", cwd = "web", description = "Install frontend dependencies from the lockfile" }
web-update = { cmd = "pnpm update --latest", cwd = "web", description = "Update frontend dependencies to their latest versions" }
web-build = { cmd = "pnpm run build", cwd = "web", depends-on = ["web-install"], description = "Compile the Vue bundle into the Python package" }
web-dev = { cmd = "pnpm dev", cwd = "web", depends-on = ["web-install"], description = "Vite dev server, proxying /api to port 8000" }
web-typecheck = { cmd = "pnpm exec vue-tsc --noEmit", cwd = "web", depends-on = ["web-install"], description = "Type-check the frontend with vue-tsc" }
web-lint = { cmd = "pnpm run lint", cwd = "web", depends-on = ["web-install"], description = "Lint the frontend with oxlint" }
# Blocking, so a newly disclosed advisory fails the build rather than sitting
# unnoticed. `--audit-level=high` because moderate findings in build-only
# dependencies would otherwise make this a gate nobody reads.
web-audit = { cmd = "pnpm audit --audit-level=high", cwd = "web", description = "Audit frontend dependencies for high-severity advisories" }

# A scratch model to develop against, so `serve` opens something real rather
# than whatever directory it happened to start in. Gitignored; delete it to get
# a clean one.
example = { cmd = "test -d example-model || calliope new example-model --template national_scale", description = "Scaffold ./example-model from Calliope's national_scale template" }

# The solved models the oracle tests and the results smoke check read. Distinct
# from `example` above, which scaffolds a model *folder* to edit: this one
# solves Calliope's two templates into examples/nc_files/. Idempotent, and
# gitignored output — the point is that it is reproducible rather than
# hand-placed, which is what used to make those tests skip in silence.
solve-examples = { cmd = "python scripts/make_examples.py", description = "Solve both Calliope example models into examples/nc_files/" }

# API only, with reload. Pair with `web-dev` (Vite proxies /api to this).
serve = { cmd = "uvicorn calliope_studio.server.app:app --reload --port 8000", env = { CALLIOPE_STUDIO_WORKSPACE = "example-model" }, description = "API on port 8000 with auto-reload, opening ./example-model", depends-on = [
  "example",
] }

# The check is not optional: `python -m build` succeeds without the frontend and
# produces a wheel with no interface, which nothing notices until a browser is
# pointed at it.
build = { cmd = "python -m build && python scripts/check_dist.py", description = "Wheel and sdist with the frontend compiled in; run with -e build", depends-on = [
  "web-build",
] }
# What the release workflow's artefacts are checked with before they go up. A
# PyPI release cannot be re-uploaded under the same version, so a long
# description that fails to render is permanent.
publish-check = { cmd = "twine check dist/*", depends-on = ["build"], description = "Check the built artefacts with twine; run with -e build" }

# Ruff is both the linter and the formatter; there is deliberately no second
# formatter to keep in step with it.
[tool.ruff]
line-length = 88
# Spelled out rather than inferred from `requires-python`, so that raising the
# floor there does not silently change how code is formatted.
target-version = "py312"
# The frozen v0.2.0 sources. Their value is being byte-identical to the tag, so
# reformatting them would quietly break the provenance claim in their README
# without changing any behaviour. `force-exclude` because `format` and `lint`
# pass `tests/` explicitly; it covers `ruff format` as well as `ruff check`.
extend-exclude = ["tests/oracle"]
force-exclude = true

[tool.ruff.format]
# Carried over from black, which was configured this way. Ruff defaults to the
# opposite, and leaving it out would reflow every call site that a trailing
# comma is currently holding open.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "W"]
# line too long; the formatter handles these
ignore = ["E501"]

# Ignore `E402` (import violations) and `F401` (unused imports) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
# Must match `format.skip-magic-trailing-comma`; ruff warns when they disagree,
# because the linter would then split an import the formatter would rejoin.
split-on-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 200
ignore-overlong-task-comments = true
