[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "calliope-studio"
authors = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
maintainers = [
  { name = "Stefan Pfenninger", email = "stefan@pfenninger.org" },
]
description = "Web UI for defining, running and analysing Calliope models."
readme = "README.md"
requires-python = ">=3.12,<3.15"
keywords = ["energy systems", "visualisation", "optimisation"]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
  "calliope>=0.7.0,<0.8.0",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pyarrow>=17",
  "ruamel.yaml>=0.18",
  "click>=8.2",
  "platformdirs>=4",
  # Imported directly, not merely inherited. Floors only: calliope's own
  # bounds (xarray>=2026.4, numpy>=2, pandas>=2.1.3 as of 0.7.0) govern resolution.
  "pandas>=2.1.3",
  "xarray>=2024.1",
  "numpy>=1.26",
  "pydantic>=2.7",
  # Reading a `.nc` structurally, without constructing a `calliope.Model`, is
  # what makes an older file openable — see `results/store.py`. It arrives with
  # xarray in practice but this layer names it directly.
  "netCDF4>=1.6",
]

[project.scripts]
calliope-studio = "calliope_studio.cli:main"

[project.urls]
homepage = "https://github.com/sjpfenninger/calliope-studio"
calliope = "https://www.callio.pe/"
repository = "https://github.com/sjpfenninger/calliope-studio"
documentation = "https://github.com/sjpfenninger/calliope-studio#readme"
issues = "https://github.com/sjpfenninger/calliope-studio/issues"
changelog = "https://github.com/sjpfenninger/calliope-studio/blob/main/CHANGELOG.md"

[tool.setuptools_scm]
# What the version is with no tags at all
fallback_version = "0.1.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]
include = ["calliope_studio*"]

[tool.setuptools.package-data]
# The Vue bundle is built from `web/` into here by `pixi run web-build`, so that
# `calliope-studio` can serve the frontend from the same process as the API.
calliope_studio = ["server/static/**"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115"
uvicorn = ">=0.34"
pyarrow = ">=17"
"ruamel.yaml" = ">=0.18"
click = ">=8.2"
netcdf4 = "*"
# Frontend toolchain, so `pixi run web-*` works without a separate Node install.
nodejs = ">=22"
coin-or-cbc = "*"

[tool.pixi.pypi-dependencies]
calliope-studio = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
gurobi = { features = ["dev", "gurobi"] }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"
# What starlette's `TestClient` speaks HTTP through.
httpx2 = "*"
pytest-cov = "*"
jsonschema = "*"
# Fixes both the package manager and the Node version
pnpm = "11.*"

[tool.pixi.feature.build.dependencies]
python-build = "*"
# Pinned to match the `dev` feature; two pnpm versions across environments would
# be two lockfile resolutions of the same `web/pnpm-lock.yaml`.
pnpm = "11.*"
# For `publish-check`
twine = "*"

[tool.pixi.feature.gurobi]
channels = ["gurobi"]

[tool.pixi.feature.gurobi.dependencies]
gurobi = "*"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/calliope_studio"]
# Paths in the report are written relative to the repository root
relative_files = true
# The run worker is a subprocess. `parallel` gives each process its own
# data file for pytest-cov to combine; `sigterm` saves the worker's data when a
# cancel kills it, which is the path the cancel tests exist for.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
# The first two are unreachable at runtime. The rest is Windows-only code, which
# the job that measures cannot execute: only Linux runs `test-cov`, deliberately,
# so without these `runs/process.py` reads 78% and `runs/worker.py` 90% while
# both are as tested as the measuring platform allows. `tests/test_process.py`
# covers the Windows halves by asserting on their source instead. The named
# functions are the ones that do not wear the `_windows_` prefix.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if IS_WINDOWS:",
    "def _windows_",
    "def _kernel32",
    "def _redirect_native_stdio",
    "def _restore_native_stdio",
]

[tool.pixi.tasks]
lint = { cmd = "ruff check src/ tests/", description = "Lint the Python sources with ruff" }
format = { cmd = "ruff format src/ tests/", description = "Format the Python sources with ruff" }
format-check = { cmd = "ruff format --check src/ tests/", description = "Check Python formatting without writing; what CI runs" }
test = { cmd = "pytest", description = "Run the Python test suite" }
test-cov = { cmd = "pytest --cov --cov-report=xml --cov-report=term-missing", description = "Run the Python test suite with coverage; writes coverage.xml" }
web-install = { cmd = "pnpm install --frozen-lockfile", cwd = "web", description = "Install frontend dependencies from the lockfile" }
web-update = { cmd = "pnpm update --latest", cwd = "web", description = "Update frontend dependencies to their latest versions" }
web-build = { cmd = "pnpm run build", cwd = "web", depends-on = ["web-install"], description = "Compile the Vue bundle into the Python package" }
# Source-mapped and unminified, so the browser checks' V8 coverage remaps to
# exact source lines. It lands in the same directory as the shipping bundle and
# `check_dist.py` bounds that directory from below only, so run `web-build`
# again before packaging; the next ordinary build empties it anyway.
web-build-cov = { cmd = "pnpm run build:coverage", cwd = "web", depends-on = ["web-install"], description = "Compile a source-mapped bundle for browser-check coverage; run web-build again before packaging" }
web-dev = { cmd = "pnpm dev", cwd = "web", depends-on = ["web-install"], description = "Vite dev server, proxying /api to port 8000" }
web-typecheck = { cmd = "pnpm exec vue-tsc --noEmit", cwd = "web", depends-on = ["web-install"], description = "Type-check the frontend with vue-tsc" }
web-lint = { cmd = "pnpm run lint", cwd = "web", depends-on = ["web-install"], description = "Lint the frontend with oxlint" }
# Blocking, so a newly disclosed advisory fails the build
web-audit = { cmd = "pnpm audit --audit-level=high", cwd = "web", description = "Audit frontend dependencies for high-severity advisories" }

# A scratch model to develop against. Gitignored; delete it to get a clean one.
example = { cmd = "test -d example-model || calliope new example-model --template national_scale", description = "Scaffold ./example-model from Calliope's national_scale template" }

# The solved models the oracle tests and the results smoke check read. Distinct
# from `example` above, which scaffolds a model *folder* to edit: this one
# solves Calliope's two templates into examples/nc_files/. Idempotent, and
# gitignored output — the point is that it is reproducible rather than
# hand-placed, which is what used to make those tests skip in silence.
solve-examples = { cmd = "python scripts/make_examples.py", description = "Solve both Calliope example models into examples/nc_files/" }

# API only, with reload. Pair with `web-dev` (Vite proxies /api to this).
serve = { cmd = "uvicorn calliope_studio.server.app:app --reload --port 8000", env = { CALLIOPE_STUDIO_WORKSPACE = "example-model" }, description = "API on port 8000 with auto-reload, opening ./example-model", depends-on = [
  "example",
] }

# The check is not optional: `python -m build` succeeds without the frontend and
# produces a wheel with no interface, which nothing notices until a browser is
# pointed at it.
build = { cmd = "python -m build && python scripts/check_dist.py", description = "Wheel and sdist with the frontend compiled in; run with -e build", depends-on = [
  "web-build",
] }
# What the release workflow's artefacts are checked with before they go up. A
# PyPI release cannot be re-uploaded under the same version, so a long
# description that fails to render is permanent.
publish-check = { cmd = "twine check dist/*", depends-on = ["build"], description = "Check the built artefacts with twine; run with -e build" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["tests/oracle"]
force-exclude = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "W"]
# line too long; the formatter handles these
ignore = ["E501"]

# Ignore `E402` (import violations) and `F401` (unused imports) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
# Must match `format.skip-magic-trailing-comma`; ruff warns when they disagree,
# because the linter would then split an import the formatter would rejoin.
split-on-trailing-comma = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 200
ignore-overlong-task-comments = true
