<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SVG only: every browser that can run this app supports SVG favicons, and
         one vector beats any fixed set of PNGs at whatever size a tab strip,
         bookmark bar or task switcher asks for. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calliope Studio</title>
    <script>
      // Pre-paint theme guard. stores/ui.ts owns this state; this only stops a
      // white flash before the bundle parses, which on a dark-mode machine is
      // the first thing you see on every reload. Keep the key in step with
      // THEME_KEY there.
      //
      // The legacy fallback runs before lib/storageKeys.ts can migrate anything
      // — this script is in <head> and that runs with the bundle — so without it
      // the first load after the rename flashes for everyone who had a theme set.
      (function () {
        try {
          var preference =
            localStorage.getItem("calliope-studio.theme") ||
            localStorage.getItem("calligraph.theme");
          var dark =
            preference === "dark" ||
            ((preference === "system" || !preference) &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          var mode = dark ? "dark" : "light";
          document.documentElement.dataset.cgTheme = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (error) {
          // A blocked localStorage is not worth failing to render over.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
