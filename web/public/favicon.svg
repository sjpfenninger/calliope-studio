<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Calliope's own favicon, recoloured into Calliope Studio's accent blue and with
    the flame clipped to the white disc — in the original the lower tongues spill
    past the circle onto the tile.

    Source of truth is the real vector artwork, kept outside this repository, in
    Academic/Projects/Calliope/Design/logo/: favicon.svg is Calliope's original,
    favicon-clipped-{red,blue}.svg add the clip, and blue-variants/ holds the
    recolourings this was chosen from. Do not hand-edit the paths here.

    Two-tone, tile lighter than flame, which is the relationship in the original
    (#b84854 tile against a #98262e flame). The flame is #026fff, mirroring the
    cg-accent design token. Writing colours literally here is a deliberate, narrow
    exception to the rule that web/src/assets/tokens.css is the only place a colour
    may be written: a favicon renders outside the page's CSS context, so a var()
    reference to a design token resolves to nothing. One blue serves both themes —
    it was checked against a white and a #171717 tab strip.

    An SVG is the only icon shipped. Every browser that can run this app supports
    SVG favicons (Chrome/Edge 80+, Firefox 41+, Safari 16+), and a vector renders
    sharp at whatever size the tab strip, bookmark bar or task switcher asks for,
    which no fixed set of PNGs manages.
-->
